name: Build and Publish Release
permissions:
  contents: write

# Two release runs uploading assets to the same tag would race; queue them
# instead (never cancel — a half-cancelled release could leave a tag with
# partial assets).
concurrency:
  group: release
  cancel-in-progress: false

# Tag pushes only. `stamp release` decides the version, renders the changelog
# into CHANGELOG.md and the annotated tag, commits and pushes — that tag push is
# what runs this. The pipeline is a worker, not a controller: it neither picks a
# version nor writes release notes.
on:
  push:
    tags: ['v*']

jobs:
  # The tag is the only input, so it has to agree with the version committed in
  # VERSION. `stamp verify` renders the tag from the committed version and
  # compares, rather than trusting whatever was pushed.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stamp
        # Pinned to a commit of the installer and a released version of the
        # binary, like every action here: this job gates what gets published.
        # The installer checks the archive against the release's checksums.
        run: |
          curl -fsSL https://raw.githubusercontent.com/p-arndt/stamp/2518ad5c573441c8dd54c6f9e5e87e968f28c159/install.sh \
            | sh -s -- --version 0.3.0 --bin-dir /usr/local/bin

      - name: Verify the tag against the committed version
        run: stamp verify --tag "$GITHUB_REF_NAME"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Digits-first, semver charset, bounded length: the version is spliced
          # into asset file names, so reject anything that isn't a plain version.
          if ! [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]{0,63}$ ]]; then
            echo "::error::version '$VERSION' is not a valid release version" >&2
            exit 1
          fi
          # Semver pre-release tags (v0.5.0-beta.1) are flagged automatically.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "VERSION=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"

  release:
    needs: verify
    # Cross-compiling with CGO disabled means one Linux runner builds every
    # target — no per-OS matrix needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Third-party actions are pinned to full commit SHAs, not tags: tags are
    # mutable, and this job runs with `contents: write` and the token that
    # publishes the release. A repointed tag on any action here could replace
    # the published binaries with something users would install unquestioningly.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes live in the annotated tag; a shallow checkout
          # without tags would not have them.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Reads the Go version straight from go.mod so it never drifts.
          go-version-file: go.mod
          cache: true

      - name: Test
        # Nothing gets built or published from a commit that fails vet + tests.
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Build static binaries (all platforms)
        # CGO_ENABLED=0 links no libc -> every binary is fully static and
        # portable across distros. -trimpath drops local paths; -s -w strips
        # symbols/DWARF. Version metadata is injected into internal/buildinfo
        # via -X, from the same version `stamp release` wrote to VERSION.
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.VERSION }}
        run: |
          set -euo pipefail
          PKG=github.com/p-arndt/compose-check-updates/internal/buildinfo
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X ${PKG}.Version=${VERSION} \
            -X ${PKG}.Commit=${COMMIT} \
            -X ${PKG}.Date=${DATE}"

          mkdir -p dist
          # Explicit target list rather than a GOOS×GOARCH cross-product:
          # darwin has no 386 or arm (GOARM) port, and windows/arm was removed
          # in Go 1.24, so a naive product would produce build failures for
          # combinations Go doesn't support.
          for target in \
            linux/amd64 linux/arm linux/arm64 linux/386 \
            windows/amd64 windows/arm64 windows/386 \
            darwin/amd64 darwin/arm64
          do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            # Raw binaries named ccu-<os>-<arch>(.exe) — the exact names the
            # README's install instructions tell users to download. Archives
            # would break every documented one-liner.
            out="dist/ccu-${GOOS}-${GOARCH}"
            [ "$GOOS" = windows ] && out="${out}.exe"
            echo "-> building $GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" .
          done

          # Checksums over the binaries (computed before the file itself exists).
          (cd dist && sha256sum ccu-* > "ccu_${VERSION}_checksums.txt")
          ls -l dist

      # The notes were written before the tag existed: `stamp release` renders
      # the changelog section into the annotated tag message, so the tag this
      # run was triggered by carries its own release notes. Nothing is generated.
      - name: Assemble release notes
        shell: bash
        env:
          PRERELEASE: ${{ needs.verify.outputs.PRERELEASE }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "## 🧪 Pre-release $GITHUB_REF_NAME" > RELEASE_NOTES.md
          else
            echo "## 🚀 Release $GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md

          body="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          # A tag with nothing noted has no body. Point at the history rather
          # than publishing an empty release page.
          if [ -n "${body//[[:space:]]/}" ]; then
            printf '%s\n' "$body" >> RELEASE_NOTES.md
          else
            printf 'See the [commit history](%s/commits/%s) for what changed.\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.verify.outputs.PRERELEASE }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
