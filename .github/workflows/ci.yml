name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is in the matrix on purpose: ccu walks the filesystem for compose
    # files and renders a TUI, both of which have path- and terminal-handling
    # behaviour a Linux-only CI would never exercise. macOS is there because it
    # is the primary development platform and ships a binary in every release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    # Third-party actions are pinned to full commit SHAs rather than tags: tags
    # are mutable, so a repointed tag would silently change what runs here.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Reads the Go version straight from go.mod so it never drifts.
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        # ./... covers the fixture-driven suite under tests/ as well. -race is
        # worth the slower run: the scanner's worker pool and the registry probe
        # queue both share state across goroutines, where a data race would
        # otherwise only show up as a rare, unreproducible failure.
        run: go test -race -coverprofile=coverage.out ./...

      # Only on ubuntu: the profile is the same everywhere, and failing the
      # gate three times over one uncovered line says nothing extra. The floor
      # is the coverage that was measured when it was introduced, so it can
      # only be raised, never drifted down.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: |
          floor=83.0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t + 0 < f + 0) { exit 1 } }' \
            || { echo "coverage fell below the floor" >&2; exit 1; }

      - name: Build
        run: go build ./...

  # A separate job, and ubuntu only: golangci-lint reads the same source on
  # every platform, so running it three times would only cost minutes.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so a new release cannot turn a green PR red on its own; bump
          # it together with the local version in the `lint` just recipe.
          version: v2.13.2
