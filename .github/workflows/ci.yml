name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Windows is in the matrix on purpose: ccu walks the filesystem for compose
  # files and renders a TUI, both of which have path- and terminal-handling
  # behaviour a Linux-only CI would never exercise. macOS is the primary
  # development platform and ships a binary in every release. -race stays on:
  # the scanner's worker pool and the registry probe queue share state across
  # goroutines, where a data race would otherwise only show up as a rare,
  # unreproducible failure.
  ci:
    uses: p-arndt/.github/.github/workflows/go-ci.yml@v1
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      race: true
      lint: 'true'
      # Bump together with GOLANGCI_LINT_VERSION in the justfile.
      golangci-lint-version: v2.14.0
