# golangci-lint configuration (schema v2).
#
# Run it with `just lint`; CI runs the same thing on the ubuntu leg only —
# nothing here is OS-dependent.
version: "2"

linters:
  # `default: standard` is errcheck, govet, ineffassign, staticcheck and
  # unused. The rest are added on purpose below.
  default: standard
  enable:
    - errorlint # errors compared with == / type-asserted instead of errors.Is/As
    - revive # style and clarity: naming, early returns, unused parameters

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        # Deliberately NOT enabled:
        #   exported            — internal/ packages are not a public API, and
        #                         requiring a doc comment on every exported
        #                         identifier in them is churn, not clarity.
        #   unused-parameter    — the TUI and report layers implement shared
        #                         signatures (bubbletea messages, renderers);
        #                         renaming ignored parameters to `_` would hide
        #                         what the slot means.
        #   package-comments    — one comment per package is already the norm
        #                         where it helps; enforcing it everywhere adds
        #                         boilerplate to leaf packages.

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .claude

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/p-arndt/compose-check-updates)
